<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso Físico</title>
    <!-- Icono para el acceso directo y navegador -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/isometric/96/activity.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/180/activity.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-chart-line"></i> Progreso Físico
        </h1>
        <button onclick="toggleSettings()" class="text-slate-400 hover:text-white p-2">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- Chart Section -->
        <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Métrica</span>
                <select id="metricSelector" onchange="updateChart()" class="bg-slate-900 text-emerald-400 font-medium text-sm rounded-lg p-2 border border-slate-700 focus:outline-none focus:border-emerald-500">
                    <option value="peso">Peso (kg)</option>
                    <option value="cintura">Cintura (cm)</option>
                    <option value="pecho">Pecho (cm)</option>
                    <option value="brazo">Brazo (cm)</option>
                    <option value="muslo">Muslo (cm)</option>
                    <option value="gemelo">Gemelo (cm)</option>
                    <option value="grasa">% Grasa corporal</option>
                    <option value="musculo">% Masa muscular</option>
                </select>
            </div>
            
            <div class="relative h-64 w-full">
                <canvas id="progressChart"></canvas>
            </div>

            <!-- Time Filter -->
            <div class="flex justify-around mt-4 pt-3 border-t border-slate-700 text-xs">
                <button onclick="setFilter('1M')" class="filter-btn text-slate-400 hover:text-emerald-400 font-medium py-1 px-2">1 Mes</button>
                <button onclick="setFilter('3M')" class="filter-btn text-slate-400 hover:text-emerald-400 font-medium py-1 px-2">3 Meses</button>
                <button onclick="setFilter('6M')" class="filter-btn text-slate-400 hover:text-emerald-400 font-medium py-1 px-2">6 Meses</button>
                <button onclick="setFilter('ALL')" class="filter-btn text-emerald-400 font-bold py-1 px-2 border-b-2 border-emerald-400">Todo</button>
            </div>
        </div>

        <!-- History List -->
        <div>
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Historial de Registros</h2>
            <div id="historyList" class="space-y-3">
                <!-- Items dynamically injected -->
            </div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition-transform active:scale-95">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Add/Edit Entry Modal -->
    <div id="entryModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center hidden z-50 p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 class="text-lg font-bold text-white" id="modalTitle">Nuevo Registro</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="recordForm" onsubmit="saveRecord(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Fecha</label>
                    <input type="date" id="inputDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Peso (kg)</label>
                        <input type="number" step="0.1" id="inputPeso" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Cintura (cm)</label>
                        <input type="number" step="0.1" id="inputCintura" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Pecho (cm)</label>
                        <input type="number" step="0.1" id="inputPecho" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Brazo (cm)</label>
                        <input type="number" step="0.1" id="inputBrazo" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Muslo (cm)</label>
                        <input type="number" step="0.1" id="inputMuslo" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Gemelo (cm)</label>
                        <input type="number" step="0.1" id="inputGemelo" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">% Grasa</label>
                        <input type="number" step="0.1" id="inputGrasa" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">% Músculo</label>
                        <input type="number" step="0.1" id="inputMusculo" placeholder="0.0" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-lg transition-colors">
                        Guardar Registro
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings / Backup Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 class="text-lg font-bold text-white">Configuración y Copia</h3>
                <button onclick="toggleSettings()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="space-y-3 pt-2">
                <button onclick="exportData()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-between border border-slate-700">
                    <span><i class="fa-solid fa-download text-emerald-400 mr-2"></i> Exportar Copia (JSON)</span>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                </button>

                <label class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-between border border-slate-700 cursor-pointer block">
                    <span><i class="fa-solid fa-upload text-emerald-400 mr-2"></i> Importar Copia (JSON)</span>
                    <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                    <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                </label>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        let records = JSON.parse(localStorage.getItem('fitnessRecords')) || [];
        let chartInstance = null;
        let activeFilter = 'ALL';
        let editingIndex = null;

        document.getElementById('inputDate').valueAsDate = new Date();

        function saveRecord(e) {
            e.preventDefault();
            
            const newRecord = {
                date: document.getElementById('inputDate').value,
                peso: parseFloat(document.getElementById('inputPeso').value) || null,
                cintura: parseFloat(document.getElementById('inputCintura').value) || null,
                pecho: parseFloat(document.getElementById('inputPecho').value) || null,
                brazo: parseFloat(document.getElementById('inputBrazo').value) || null,
                muslo: parseFloat(document.getElementById('inputMuslo').value) || null,
                gemelo: parseFloat(document.getElementById('inputGemelo').value) || null,
                grasa: parseFloat(document.getElementById('inputGrasa').value) || null,
                musculo: parseFloat(document.getElementById('inputMusculo').value) || null,
            };

            if (editingIndex !== null) {
                records[editingIndex] = newRecord;
                editingIndex = null;
            } else {
                records.push(newRecord);
            }

            records.sort((a, b) => new Date(a.date) - new Date(b.date));

            localStorage.setItem('fitnessRecords', JSON.stringify(records));
            
            closeModal();
            renderApp();
        }

        function deleteRecord(index) {
            if (confirm('¿Eliminar este registro?')) {
                records.splice(index, 1);
                localStorage.setItem('fitnessRecords', JSON.stringify(records));
                renderApp();
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';

            if (records.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-500">
                        <i class="fa-solid fa-inbox text-3xl mb-2 block"></i>
                        <p class="text-sm">No hay registros guardados.</p>
                    </div>`;
                return;
            }

            [...records].reverse().forEach((record) => {
                const realIndex = records.indexOf(record);
                const dateObj = new Date(record.date);
                const formattedDate = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });

                let details = [];
                if (record.peso) details.push(`Peso: ${record.peso}kg`);
                if (record.cintura) details.push(`Cintura: ${record.cintura}cm`);
                if (record.pecho) details.push(`Pecho: ${record.pecho}cm`);
                if (record.brazo) details.push(`Brazo: ${record.brazo}cm`);
                if (record.muslo) details.push(`Muslo: ${record.muslo}cm`);
                if (record.gemelo) details.push(`Gemelo: ${record.gemelo}cm`);
                if (record.grasa) details.push(`Grasa: ${record.grasa}%`);
                if (record.musculo) details.push(`Músculo: ${record.musculo}%`);

                container.innerHTML += `
                    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3.5 flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold text-emerald-400 mb-1">${formattedDate}</div>
                            <div class="text-xs text-slate-300 gap-x-2 gap-y-1 flex flex-wrap">
                                ${details.map(d => `<span class="bg-slate-700/50 px-1.5 py-0.5 rounded border border-slate-600/40">${d}</span>`).join('')}
                            </div>
                        </div>
                        <button onclick="deleteRecord(${realIndex})" class="text-slate-500 hover:text-rose-400 p-2">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>`;
            });
        }

        function updateChart() {
            const metric = document.getElementById('metricSelector').value;
            const ctx = document.getElementById('progressChart').getContext('2d');

            let filteredRecords = filterByDate(records, activeFilter);

            const labels = filteredRecords.map(r => {
                const d = new Date(r.date);
                return `${d.getDate()}/${d.getMonth()+1}`;
            });
            
            const data = filteredRecords.map(r => r[metric] || null);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: metric.toUpperCase(),
                        data: data,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        pointBackgroundColor: '#10b981',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.2,
                        spanGaps: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(51, 65, 85, 0.3)' },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(51, 65, 85, 0.3)' },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function filterByDate(data, filter) {
            if (filter === 'ALL' || data.length === 0) return data;
            
            const now = new Date();
            let limitDate = new Date();

            if (filter === '1M') limitDate.setMonth(now.getMonth() - 1);
            if (filter === '3M') limitDate.setMonth(now.getMonth() - 3);
            if (filter === '6M') limitDate.setMonth(now.getMonth() - 6);

            return data.filter(r => new Date(r.date) >= limitDate);
        }

        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn text-slate-400 hover:text-emerald-400 font-medium py-1 px-2';
            });
            event.target.className = 'filter-btn text-emerald-400 font-bold py-1 px-2 border-b-2 border-emerald-400';
            updateChart();
        }

        function openModal() {
            document.getElementById('recordForm').reset();
            document.getElementById('inputDate').valueAsDate = new Date();
            editingIndex = null;
            document.getElementById('entryModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('entryModal').classList.add('hidden');
        }

        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `progreso_fisico_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        records = imported;
                        localStorage.setItem('fitnessRecords', JSON.stringify(records));
                        renderApp();
                        toggleSettings();
                        alert('¡Datos importados con éxito!');
                    } else {
                        alert('El archivo no tiene un formato válido.');
                    }
                } catch (err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        }

        function renderApp() {
            updateChart();
            renderHistory();
        }

        // Init
        renderApp();
    </script>
</body>
</html>
